<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1080" viewBox="40 0 1760 1080" role="img" aria-labelledby="title desc"><title id="title">里商曳影：传统制作与优化流程对比 / Traditional and redesigned making processes</title><desc id="desc">传统流程七步：灯骨制作、绘纸花样、压平、雕刻、拓印晾干、针刺、糊上灯骨。优化流程五步：组装纸骨、选图或绘图、针刺、上色、磁吸装配。制作时间由约三天缩短至四十分钟。压平与雕刻分开计数。</desc>
<style>text{font-family:"Helvetica Neue",Arial,"Microsoft YaHei","PingFang SC",sans-serif;fill:#efede7}.heading{font-size:30px;font-weight:500}.kicker{font-size:16px;letter-spacing:1.4px;fill:#c8bda1}.num{font-size:20px;fill:#aaa79f}.accent{fill:#c8bda1}.step{font-size:23px;font-weight:500}.body{font-size:19px}.en{font-size:17px;fill:#aaa79f}.small{font-size:15px}.metric{font-size:44px}.note{font-size:17px;fill:#aaa79f}</style>
<rect width="1800" height="1080" fill="#1c1c1b"/>
<text x="40" y="42" class="kicker">PROCESS COMPARISON / 制作流程对比</text>
<line x1="40" y1="65" x2="1740" y2="65" stroke="#3d3c38"/>
<text x="40" y="125" class="metric">约 3 天 → 40 分钟</text><text x="745" y="125" class="metric">7 步 → 5 步</text><text x="1290" y="120" class="heading">固定粘贴 → 磁吸可换</text>
<text x="40" y="161" class="en">Making time · project records</text><text x="745" y="161" class="en">Main operations</text><text x="1290" y="161" class="en">Fixed panel → replaceable panel</text>
<text x="40" y="239" class="heading">01 / 原有制作流程</text>
<g><text x="220" y="293" class="num">01</text><line x1="220" y1="311" x2="418" y2="311" stroke="#555550"/><text x="220" y="349" class="step">灯骨制作</text><text x="220" y="376" class="en">Bamboo frame</text><text x="220" y="421" class="body">毛竹、扎线</text><text x="220" y="446" class="en small">Bamboo · binding thread</text><text x="220" y="497" class="body">削竹成条，绑扎定型</text><text x="220" y="524" class="body">取材不便，操作易伤手</text><text x="220" y="557" class="en small">Split and bind bamboo</text><text x="220" y="580" class="en small">Hard to source; injury risk</text></g><g><text x="438" y="293" class="num">02</text><line x1="438" y1="311" x2="636" y2="311" stroke="#555550"/><text x="438" y="349" class="step">绘纸花样</text><text x="438" y="376" class="en">Draw pattern</text><text x="438" y="421" class="body">笔、复写纸</text><text x="438" y="446" class="en small">Pen · carbon paper</text><text x="438" y="497" class="body">绘制吉祥纹样</text><text x="438" y="524" class="body">裁成对应尺寸</text><text x="438" y="557" class="en small">Draw auspicious motifs</text><text x="438" y="580" class="en small">Cut to the frame size</text></g><g><text x="656" y="293" class="num">03</text><line x1="656" y1="311" x2="854" y2="311" stroke="#555550"/><text x="656" y="349" class="step">压平</text><text x="656" y="376" class="en">Press layers</text><text x="656" y="421" class="body">羊油板、红绿纸</text><text x="656" y="446" class="en small">Tallow board · colored paper</text><text x="656" y="497" class="body">红绿纸错位叠合</text><text x="656" y="524" class="body">打孔固定后压平</text><text x="656" y="557" class="en small">Offset and secure paper layers</text><text x="656" y="580" class="en small">Press on a tallow board</text></g><g><text x="874" y="293" class="num">04</text><line x1="874" y1="311" x2="1072" y2="311" stroke="#555550"/><text x="874" y="349" class="step">雕刻</text><text x="874" y="376" class="en">Carve stencil</text><text x="874" y="421" class="body">雕刻刀、垫纸</text><text x="874" y="446" class="en small">Carving knife · backing paper</text><text x="874" y="497" class="body">依纹样逐层雕刻</text><text x="874" y="524" class="body">制版复杂，难以批量</text><text x="874" y="557" class="en small">Carve the layered pattern</text><text x="874" y="580" class="en small">Complex stencil preparation</text></g><g><text x="1092" y="293" class="num">05</text><line x1="1092" y1="311" x2="1290" y2="311" stroke="#555550"/><text x="1092" y="349" class="step">拓印、晾干</text><text x="1092" y="376" class="en">Print &amp; dry</text><text x="1092" y="421" class="body">绵纸</text><text x="1092" y="446" class="en small">Thin paper</text><text x="1092" y="497" class="body">粘贴绵纸，拓印纹样</text><text x="1092" y="524" class="body">等待纸面自然晾干</text><text x="1092" y="557" class="en small">Transfer motifs onto paper</text><text x="1092" y="580" class="en small">Allow the print to dry</text></g><g><text x="1310" y="293" class="num">06</text><line x1="1310" y1="311" x2="1508" y2="311" stroke="#555550"/><text x="1310" y="349" class="step">针刺</text><text x="1310" y="376" class="en">Needle piercing</text><text x="1310" y="421" class="body">绣花针、筷子</text><text x="1310" y="446" class="en small">Needle · chopsticks</text><text x="1310" y="497" class="body">绑扎针与筷子后刺孔</text><text x="1310" y="524" class="body">需反复操作、控制疏密</text><text x="1310" y="557" class="en small">Bind a needle to chopsticks</text><text x="1310" y="580" class="en small">Repeated, precise piercing</text></g><g><text x="1528" y="293" class="num">07</text><line x1="1528" y1="311" x2="1726" y2="311" stroke="#555550"/><text x="1528" y="349" class="step">糊上灯骨</text><text x="1528" y="376" class="en">Paste onto frame</text><text x="1528" y="421" class="body">粘合剂</text><text x="1528" y="446" class="en small">Adhesive</text><text x="1528" y="497" class="body">将纸面粘贴在灯骨上</text><text x="1528" y="524" class="body">固定后不便更换图案</text><text x="1528" y="557" class="en small">Glue the panel to the frame</text><text x="1528" y="580" class="en small">Difficult to replace once fixed</text></g>
<line x1="220" y1="625" x2="1740" y2="625" stroke="#3d3c38"/>
<text x="40" y="682" class="heading">02 / 优化后的制作体验</text>
<g><text x="220" y="736" class="num accent">01</text><line x1="220" y1="754" x2="505" y2="754" stroke="#c8bda1"/><text x="220" y="792" class="step">灯骨制作</text><text x="220" y="819" class="en">Assemble frame</text><text x="220" y="864" class="body">预裁白卡纸、胶水</text><text x="220" y="889" class="en small">Pre-cut card · glue</text><text x="220" y="940" class="body">按折线折叠、粘合</text><text x="220" y="967" class="body">替代削竹与绑扎</text><text x="220" y="1000" class="en small">Fold and glue pre-cut card</text><text x="220" y="1023" class="en small">Replaces splitting and binding</text></g><g><text x="525" y="736" class="num accent">02</text><line x1="525" y1="754" x2="810" y2="754" stroke="#c8bda1"/><text x="525" y="792" class="step">绘纸花样</text><text x="525" y="819" class="en">Choose / draw</text><text x="525" y="864" class="body">图案卡、空白纸、笔</text><text x="525" y="889" class="en small">Pattern cards · blank paper</text><text x="525" y="940" class="body">选用现成图案卡</text><text x="525" y="967" class="body">也可自由绘制纹样</text><text x="525" y="1000" class="en small">Choose a supplied pattern</text><text x="525" y="1023" class="en small">Or draw an original motif</text></g><g><text x="830" y="736" class="num accent">03</text><line x1="830" y1="754" x2="1115" y2="754" stroke="#c8bda1"/><text x="830" y="792" class="step">针刺</text><text x="830" y="819" class="en">Pierce pattern</text><text x="830" y="864" class="body">橡皮章、厚宣纸、锥子</text><text x="830" y="889" class="en small">Rubber block · paper · awl</text><text x="830" y="940" class="body">橡皮章替代羊油板</text><text x="830" y="967" class="body">锥子替代针筷组合</text><text x="830" y="1000" class="en small">Rubber block replaces tallow</text><text x="830" y="1023" class="en small">Awl replaces bound needle</text></g><g><text x="1135" y="736" class="num accent">04</text><line x1="1135" y1="754" x2="1420" y2="754" stroke="#c8bda1"/><text x="1135" y="792" class="step">上色</text><text x="1135" y="819" class="en">Add color</text><text x="1135" y="864" class="body">颜料、画笔</text><text x="1135" y="889" class="en small">Paint · brush</text><text x="1135" y="940" class="body">用画笔为纹样上色</text><text x="1135" y="967" class="body">拓展原有彩纸配色</text><text x="1135" y="1000" class="en small">Paint the pierced pattern</text><text x="1135" y="1023" class="en small">Expands the color palette</text></g><g><text x="1440" y="736" class="num accent">05</text><line x1="1440" y1="754" x2="1725" y2="754" stroke="#c8bda1"/><text x="1440" y="792" class="step">磁吸附灯骨</text><text x="1440" y="819" class="en">Attach magnetically</text><text x="1440" y="864" class="body">灯窗卡、磁吸条</text><text x="1440" y="889" class="en small">Window panel · magnets</text><text x="1440" y="940" class="body">磁吸灯窗固定于灯骨</text><text x="1440" y="967" class="body">可拆卸、随时换图案</text><text x="1440" y="1000" class="en small">Attach the window with magnets</text><text x="1440" y="1023" class="en small">Remove and swap the motif</text></g>
<line x1="190" y1="282" x2="190" y2="595" stroke="#3d3c38"/><line x1="190" y1="725" x2="190" y2="1038" stroke="#3d3c38"/><text x="40" y="349" class="body accent">制作步骤</text><text x="40" y="376" class="en small">Making steps</text><text x="40" y="421" class="body accent">所需材料</text><text x="40" y="448" class="en small">Materials</text><text x="40" y="497" class="body accent">操作与痛点</text><text x="40" y="524" class="en small">Actions &amp; barriers</text><text x="40" y="792" class="body accent">制作步骤</text><text x="40" y="819" class="en small">Making steps</text><text x="40" y="864" class="body accent">所需材料</text><text x="40" y="891" class="en small">Materials</text><text x="40" y="940" class="body accent">操作与改进</text><text x="40" y="967" class="en small">Actions &amp; changes</text></svg>
